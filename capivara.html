<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Capivara no Capibaribe</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        #gameCanvas {
            background-color: #87CEEB;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #instrucoes {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instrucoes">
        Controles:<br>
        [↑] ou [E] - Andar<br>
        [Q] - Comer (Crescer)<br>
        [W] - Fazer cocô (Diminuir)<br>
        [R] - Resetar tela
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
    
        function desenharCenario() {
            // Céu 
            ctx.fillStyle = '#329dc8';
            ctx.fillRect(0, 0, 800, 300);

            // Prédios ao fundo
            ctx.fillStyle = '#8a949b';
            ctx.fillRect(100, 150, 80, 150);
            ctx.fillRect(600, 100, 100, 200);

            // Casarões coloridos
            ctx.fillStyle = '#e5c07b'; // Amarelo
            ctx.fillRect(50, 220, 90, 80);
            ctx.fillStyle = '#e06c75'; // Rosa
            ctx.fillRect(140, 230, 90, 70);
            ctx.fillStyle = '#61afef'; // Azul
            ctx.fillRect(230, 210, 100, 90);
            ctx.fillStyle = '#98c379'; // Verde
            ctx.fillRect(330, 230, 90, 70);

            // Grama 
            ctx.fillStyle = '#3a5f0b';
            ctx.fillRect(0, 300, 800, 300);

            // Rio
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 320, 800, 150);
        }

        function atualizar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            desenharCenario();
            requestAnimationFrame(atualizar);
        }

        atualizar();
    </script>
</body>
</html>
